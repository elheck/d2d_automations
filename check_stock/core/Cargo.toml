[package]
name = "check_stock_core"
version = "0.1.0"
edition = "2021"
description = "Logic and data layer of the MTG stock checker: no UI, no platform paths"

[features]
# Test helpers (e.g. `Card::test_default`) for crates that test against this
# one. Never enabled in a release build.
test-support = []

[dependencies]
mtg_common = { path = "../../mtg_common", features = ["blocking"] }
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.40"
regex = "1.10.3"
lazy_static = "1.4.0"
log = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3.12.0"
wiremock = "0.6"
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
