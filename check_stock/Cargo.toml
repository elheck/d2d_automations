[package]
name = "d2d_automations"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "MTG Stock Checker and Analysis Tool"

# Everything belonging to check_stock lives in this folder. The desktop app is
# the root package; `core` holds all logic and data access (no UI), `server`
# is the web backend. A plain `cargo test` / `clippy` / `build` here covers all.
[workspace]
members = ["core", "server"]
default-members = [".", "core", "server"]

# Password hashing is deliberately slow; unoptimized it takes seconds per hash
# and makes the login tests crawl. Optimize just these crates in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Automatically strip symbols from the binary


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# All logic and data access; this crate is only the egui front end.
check_stock_core = { path = "core" }
csv = "1.3.1"
chrono = "0.4.40"
log = "0.4"
env_logger = "0.11"
image = "0.25"
egui_extras = { version = "0.31", features = ["image"] }
dirs = "5.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15.3" }

# Linux: enable xdg-portal for Wayland native file dialogs
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15.3", features = ["xdg-portal"] }

# Unix (Linux + macOS): explicit winit for window system integration
[target.'cfg(unix)'.dependencies]
winit = { version = "0.30.9", features = ["x11", "wayland"] }

[dev-dependencies]
check_stock_core = { path = "core", features = ["test-support"] }
tempfile = "3.12.0"
