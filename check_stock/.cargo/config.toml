[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# TypeScript types for the web UI, generated from the server's API structs by
# ts-rs during `cargo test` (CI fails if the committed files are out of date).
[env]
TS_RS_EXPORT_DIR = { value = "web/src/api/generated", relative = true }
TS_RS_LARGE_INT = "number"
